 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.n)},k,u8(B.ct))))}
async function go(e){e.preventDefault();const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value,w=B.u[u];const er=document.getElementById('err');er.textContent='Checking… 🔐';
 try{if(!w)throw 0;const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(w.s),iterations:B.it,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
 const K=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(w.n),additionalData:new TextEncoder().encode(u)},kek,u8(w.k)));
 D=await unlock(K);sessionStorage.bbk=btoa(String.fromCharCode(...K));sessionStorage.bbu=u;show()}catch(x){er.textContent='Nope — wrong username or password 🙅'}}
function logout(){sessionStorage.clear();location.reload()}
(async()=>{if(sessionStorage.bbk){try{D=await unlock(u8(sessionStorage.bbk));show()}catch(e){sessionStorage.clear()}}})();
const $=n=>'A$'+Number(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bne=d=>new Date(d).toLocaleString('en-AU',{timeZone:'Australia/Brisbane',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
 document.getElementById('meta').textContent='Hi '+(sessionStorage.bbu||'')+' 👋 · data refreshed '+bne(D.generated)+' (Brisbane time) · emails snapshot '+bne(D.snap_time*1000);render()}
function sel(){const v=document.getElementById('per').value;let s=v==='all'?'1970':v.includes('T')?v:new Date(Date.now()-v*864e5).toISOString();
 return {o:D.orders.filter(r=>r.date>=s&&!r.cancelled),e:D.emails.filter(r=>r.date>=s)}}
function render(){const {o}=sel();const S=k=>o.reduce((a,r)=>a+r[k],0);const net=S('net'),fee=S('fee'),cost=S('cost'),pr=S('profit');
 const ea=o.filter(r=>!r.cost_actual).length,unf=o.filter(r=>r.ful!=='FULFILLED').length;
 const K=[['g1','🛒 Orders',o.length,'eBay '+o.filter(r=>r.channel==='eBay').length+' · Shopify '+o.filter(r=>r.channel!=='eBay').length],
 ['g5','💵 Income in',$(net),'after refunds'],['g2','🏭 Supplier costs',$(cost),ea+' of '+o.length+' orders estimated 🟡'],
 ['g4','💸 Fees',$(fee),'eBay ~13% est 🟡'],['g3','🤑 Profit',$(pr),(net?(pr/net*100).toFixed(1):0)+'% margin · partly est'],
 ['g6','📦 To fulfil',unf,'avg order '+$(o.length?net/o.length:0)]];
 document.getElementById('kpis').innerHTML=K.map(k=>`<div class="kpi ${k[0]}"><div class="l">${k[1]}</div><div class="v">${k[2]}</div><div class="s">${k[3]}</div></div>`).join('');
 const by={};o.forEach(r=>{const d=new Date(r.date).toLocaleDateString('en-CA',{timeZone:'Australia/Brisbane'});by[d]=by[d]||[0,0];by[d][0]+=r.net;by[d][1]+=r.profit});
 const ds=Object.keys(by).sort();ch.forEach(c=>c.destroy());Chart.defaults.color='#fff';Chart.defaults.maintainAspectRatio=false;
 ch=[new Chart(c1,{type:'bar',data:{labels:ds,datasets:[{label:'Sales',data:ds.map(d=>by[d][0]),backgroundColor:'#4facfe',borderRadius:8},{label:'Profit',data:ds.map(d=>by[d][1]),backgroundColor:'#38ef7d',borderRadius:8}]}}),
 new Chart(c2,{type:'doughnut',data:{labels:['Supplier costs','Fees','Profit'],datasets:[{data:[cost,fee,Math.max(pr,0)],backgroundColor:['#f7b733','#f5576c','#38ef7d']}]}})];
 tab(T)}
function tab(i,b){T=i;if(b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
 const {o,e}=sel();const P=(a)=>a?'<span class="pill act">actual</span>':'<span class="pill est">est</span>';let h='';
 if(i==0)h='<table><tr><th>Date</th><th>Order</th><th>Ch</th><th>Items</th><th>Income</th><th>Fees</th><th>Cost</th><th>Profit</th><th>Status</th></tr>'+o.slice().reverse().map(r=>`<tr><td>${bne(r.date)}</td><td>${esc(r.order)}</td><td>${r.channel=='eBay'?'🟦 eBay':'🟩 Shop'}</td><td>${esc(r.items)}<div class="mini">${esc(r.buyer)} · ${esc(r.ship_to)}</div></td><td>${$(r.net)}</td><td>${$(r.fee)} ${P(!r.fee_src.startsWith('est'))}</td><td title="${esc(r.cost_src)}">${$(r.cost)} ${P(r.cost_actual)}</td><td class="${r.profit<0?'neg':'pos'}">${$(r.profit)}</td><td>${esc(r.fin)}<br>${esc(r.ful)}</td></tr>`).join('')+'</table>';
 if(i==1)h='<table><tr><th>Order</th><th>Supplier</th><th>Latest supplier status</th><th>Tracking</th><th>Shopify</th></tr>'+o.slice().reverse().map(r=>`<tr><td>${esc(r.order)}<div class="mini">${bne(r.date)}</div></td><td>${esc(r.supplier||'—')}</td><td class="mini">${esc(r.supplier_status||'no log entry')}</td><td>${r.tracking.map(t=>t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.company)} ${esc(t.number)}</a>`:esc(t.carrier+' '+t.number)).join('<br>')||'⏳ none yet'}</td><td>${r.ful=='FULFILLED'?'✅':'🕒'} ${esc(r.ful)}</td></tr>`).join('')+'</table>';
 if(i>=2){const L=e.filter(m=>i==3?m.ebay:true);h=(i==3?'<p class="mini">🛒 Shows our replies sent through eBay\'s buyer relay and eBay notification mail found in the Big Burjos Gmail. Buyer messages that stay inside eBay Messages are not mirrored here yet (see note).</p>':'')+
 '<table><tr><th>When</th><th></th><th>From / To</th><th>Subject &amp; preview</th></tr>'+L.map(m=>`<tr class="${m.dir}"><td>${bne(m.date)}</td><td>${m.dir=='in'?'📥 In':'📤 Our reply'}</td><td>${esc(m.dir=='in'?m.from:'→ '+m.to)}</td><td><b>${esc(m.subject)}</b><div class="mini">${esc(m.snippet)}</div></td></tr>`).join('')+'</table>'}
 document.getElementById('tab').innerHTML=h}
</script></body></html>
